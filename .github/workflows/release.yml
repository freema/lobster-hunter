name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
      # No NPM_TOKEN: the publish authenticates over GitHub OIDC, and npm
      # attaches the provenance attestation on its own.
      - name: Verify npm supports trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          REQUIRED=11.5.1
          if [ "$(printf '%s\n' "$REQUIRED" "$NPM_VERSION" | sort -V | head -1)" != "$REQUIRED" ]; then
            echo "npm >= $REQUIRED required for trusted publishing, got $NPM_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to NPM
        run: npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Pushover Notification - Success
        if: success()
        run: |
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER }}" \
            --form-string "title=✅ lobster-hunter Released" \
            --form-string "message=Version ${{ github.ref_name }} successfully published to NPM and GitHub" \
            --form-string "priority=0" \
            --form-string "sound=pushover" \
            https://api.pushover.net/1/messages.json

      - name: Send Pushover Notification - Failure
        if: failure()
        run: |
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER }}" \
            --form-string "title=❌ lobster-hunter Release Failed" \
            --form-string "message=Version ${{ github.ref_name }} failed to publish. Check GitHub Actions." \
            --form-string "priority=1" \
            --form-string "sound=siren" \
            https://api.pushover.net/1/messages.json
